<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  @media (max-width: 1140px) {
    [data-desktop-nav="true"] { display: none !important; }
    [data-mobile-toggle="true"] { display: flex !important; }
  }
  @media (max-width: 640px) {
    [data-header-cta="true"] { display: none !important; }
  }
  @keyframes bmcc-ticker { from { transform: translateX(0); } to { transform: translateX(-50%); } }
  @media (max-width: 760px) {
    [data-ticker] { order: 3; flex-basis: 100% !important; }
  }
  @media (prefers-reduced-motion: reduce) {
    [data-ticker-track] { animation: none !important; }
  }
</style>
</helmet>

<div dir="{{ dir }}" ref="{{ rootRef }}" style="font-family: Inter, ui-sans-serif, system-ui, sans-serif;">
  <!-- UTILITY BAR -->
  <div style="background: #101d33; color: #eef2f8; font-size: 13px;">
    <div style="max-width: 1180px; margin: 0 auto; padding: 8px clamp(20px,4vw,32px); display: flex; align-items: center; justify-content: space-between; gap: 16px; flex-wrap: wrap;">
      <div style="display:flex; align-items:center; gap:8px; opacity:0.9;">
        <span style="color:#ffffff; font-weight:700;">{{ t.next_prayer }}</span>
        <a href="Prayer Times.dc.html" style="color:#ffffff; font-weight:700;">{{ nextPrayerName }} {{ nextPrayerTime }}</a>
        <sc-if value="{{ nextPrayerTomorrow }}"><span style="opacity:0.6;">({{ t.tomorrow }})</span></sc-if>
      </div>
      <div data-ticker dir="ltr" aria-label="{{ t.announcements_label }}" style="flex:1 1 0; min-width:0; overflow:hidden; display:flex; align-items:center; gap:10px; border-left:1px solid #2a3b5a; border-right:1px solid #2a3b5a; padding:0 14px;">
        <span style="flex-shrink:0; background:#2f6fed; color:#ffffff; font-size:11px; font-weight:800; letter-spacing:0.06em; text-transform:uppercase; padding:3px 8px; border-radius:4px;">{{ t.announcements_label }}</span>
        <div style="flex:1; min-width:0; overflow:hidden; -webkit-mask-image:linear-gradient(90deg,transparent,#000 24px,#000 calc(100% - 24px),transparent); mask-image:linear-gradient(90deg,transparent,#000 24px,#000 calc(100% - 24px),transparent);">
          <div data-ticker-track style="display:inline-flex; width:max-content; white-space:nowrap; animation:bmcc-ticker 45s linear infinite;" style-hover="animation-play-state:paused;">
            <sc-for list="{{ tickerItems }}" as="a" hint-placeholder-count="6">
              <a href="{{ a.href }}" dir="auto" style="display:inline-flex; align-items:center; gap:10px; color:#eef2f8; padding-right:36px;" style-hover="color:#8fb0e8;">
                <span style="color:#8fb0e8;">◆</span>{{ a.text }}
              </a>
            </sc-for>
          </div>
        </div>
      </div>
      <div style="display:flex; align-items:center; gap:18px;">
        <div style="position:relative;">
          <button onClick="{{ toggleLangOpen }}" style="background:none; border:none; color:#eef2f8; font-size:13px; font-family:inherit; cursor:pointer; display:flex; align-items:center; gap:6px; padding:2px 0;">
            {{ langLabel }}
            <span style="font-size:10px;">▾</span>
          </button>
          <sc-if value="{{ langOpen }}">
            <div style="position:absolute; top:24px; right:0; background:#ffffff; border:1px solid #e4e2da; border-radius:8px; box-shadow:0 12px 28px rgba(15,61,46,0.18); min-width:120px; z-index:40; overflow:hidden;">
              <sc-for list="{{ languages }}" as="l" hint-placeholder-count="5">
                <button onClick="{{ l.select }}" style="display:block; width:100%; text-align:left; background:none; border:none; padding:9px 14px; font-family:inherit; font-size:13px; color:#101828; cursor:pointer;" style-hover="background:#eaf1fe;">{{ l.name }}</button>
              </sc-for>
            </div>
          </sc-if>
        </div>
        <a href="BMCC Website.dc.html#member-access" style="color:#eef2f8; font-size:13px; font-weight:600;">{{ t.member_login }}</a>
        <a href="Donate.dc.html" style="background:#2f6fed; color:#ffffff; font-size:13px; font-weight:700; padding:6px 14px; border-radius:7px; white-space:nowrap;" style-hover="background:#1d54c4; color:#ffffff;">{{ t.header_donate }}</a>
      </div>
    </div>
  </div>

  <!-- HEADER / MEGA NAV -->
  <header style="background:#ffffff; border-bottom:1px solid #e2e5ea; position:sticky; top:0; z-index:30;">
    <div style="max-width:1180px; margin:0 auto; padding:12px clamp(10px,2vw,28px); display:flex; align-items:center; justify-content:space-between; gap:4px;">
      <a href="BMCC Website.dc.html" style="display:flex; align-items:center;">
        <img src="assets/bmcc-logo.jpeg" alt="Brentwood Muslim Community Center" style="height:34px; width:auto; object-fit:contain; flex-shrink:0;" />
      </a>

      <nav style="display:flex; align-items:center; gap:13px; min-width:0; flex:1 1 auto;" data-desktop-nav="true">
        <sc-for list="{{ menus }}" as="m" hint-placeholder-count="4">
          <div style="position:relative;">
            <sc-if value="{{ m.hasMenu }}" hint-placeholder-val="{{ true }}">
              <button onClick="{{ m.toggle }}" style="background:none; border:none; margin:0; font-family:inherit; cursor:pointer; display:inline-flex; align-items:center; height:23px; gap:4px; font-size:14.5px; font-weight:700; line-height:1; color:{{ m.color }}; padding:0 0 4px 0; border-bottom:2px solid {{ m.borderColor }}; white-space:nowrap;">
                {{ m.label }} <span style="font-size:10px;">▾</span>
              </button>
            </sc-if>
            <sc-if value="{{ !m.hasMenu }}">
              <a href="{{ m.href }}" style="display:inline-flex; align-items:center; height:23px; font-size:14.5px; font-weight:700; line-height:1; color:{{ m.color }}; padding:0 0 4px 0; border-bottom:2px solid {{ m.borderColor }}; white-space:nowrap;">{{ m.label }}</a>
            </sc-if>
            <sc-if value="{{ m.open }}">
              <div style="position:absolute; top:32px; left:0; background:#ffffff; border:1px solid #e4e2da; border-radius:10px; box-shadow:0 16px 36px rgba(15,61,46,0.18); min-width:280px; z-index:40; overflow:hidden; padding:8px;">
                <sc-for list="{{ m.items }}" as="it" hint-placeholder-count="3">
                  <a href="{{ it.href }}" target="{{ it.linkTarget }}" rel="{{ it.linkRel }}" style="display:block; padding:10px 12px; border-radius:8px;" style-hover="background:#eaf1fe;">
                    <div style="font-size:14px; font-weight:700; color:#0b1524;">{{ it.label }}</div>
                    <div style="font-size:12.5px; color:#6b7280; margin-top:2px;">{{ it.description }}</div>
                  </a>
                </sc-for>
              </div>
            </sc-if>
          </div>
        </sc-for>
      </nav>

      <div style="display:flex; align-items:center; gap:10px;">
        <div style="position:relative; display:flex; align-items:center;">
          <sc-if value="{{ searchOpen }}">
            <input value="{{ searchQuery }}" onChange="{{ onSearchChange }}" placeholder="{{ t.search_placeholder }}" autoFocus="{{ true }}" style="width:180px; padding:8px 12px; border-radius:7px; border:1px solid #d7dce3; font-family:inherit; font-size:13.5px; margin-right:8px;" />
          </sc-if>
          <button onClick="{{ toggleSearch }}" aria-label="Search" style="width:28px; height:28px; border-radius:7px; border:1px solid #e4e2da; background:#fff; cursor:pointer; display:flex; align-items:center; justify-content:center; color:#101d33; font-size:12px; flex-shrink:0;">
            <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round"><circle cx="11" cy="11" r="7"></circle><line x1="21" y1="21" x2="16.4" y2="16.4"></line></svg>
          </button>
        </div>
        <button onClick="{{ toggleMobileNav }}" data-mobile-toggle="true" style="display:none; width:38px; height:38px; border-radius:8px; border:1px solid #e4e2da; background:#fff; cursor:pointer; font-size:16px; color:#101d33;">≡</button>
      </div>
    </div>
    <sc-if value="{{ mobileNavOpen }}">
      <div style="border-top:1px solid #e2e5ea; padding:14px clamp(20px,4vw,32px); display:flex; flex-direction:column; gap:18px; max-height:70vh; overflow-y:auto;">
        <sc-for list="{{ menus }}" as="m" hint-placeholder-count="4">
          <div>
            <sc-if value="{{ !m.hasMenu }}">
              <a href="{{ m.href }}" style="font-size:15px; font-weight:700; color:#0b1524;">{{ m.label }}</a>
            </sc-if>
            <sc-if value="{{ m.hasMenu }}">
              <div style="font-size:12.5px; font-weight:700; text-transform:uppercase; letter-spacing:0.06em; color:#2354a6; margin-bottom:8px;">{{ m.label }}</div>
              <div style="display:flex; flex-direction:column; gap:10px; padding-left:4px;">
                <sc-for list="{{ m.items }}" as="it" hint-placeholder-count="3">
                  <a href="{{ it.href }}" target="{{ it.linkTarget }}" rel="{{ it.linkRel }}" style="font-size:14.5px; font-weight:600; color:#101828;">{{ it.label }}</a>
                </sc-for>
              </div>
            </sc-if>
          </div>
        </sc-for>
      </div>
    </sc-if>
  </header>
</div>

</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;: {&quot;width&quot;: 1180, &quot;height&quot;: 100}, &quot;current&quot;: {&quot;editor&quot;: null, &quot;default&quot;: &quot;home&quot;, &quot;tsType&quot;: &quot;string&quot;}}">
const EN_DEFAULT = {
  nav_home: 'Home', nav_prayer: 'Prayer Times', nav_programs: 'Programs', nav_services_assistance: 'Services & Assistance',
  nav_give: 'Donations & Memberships', nav_about: 'About', nav_hikmah: 'Hikmah School', nav_events: 'Events & Calendar',
  nav_community: 'Community Directory',
  nav_hikmah_desc: 'Weekend Islamic education, ages 6–16',
  nav_events_desc: 'Upcoming community events', nav_community_desc: 'Member business & service listings',
  nav_services: 'Services', nav_services_desc: "Nikah, counseling, Ask an Imam & more", nav_assistance: 'Assistance',
  nav_assistance_desc: 'Zakat, food pantry, refugee support & more', nav_donate: 'Donate', nav_donate_desc: 'One-time or monthly giving',
  nav_membership: 'Become a Member', nav_membership_desc: '$100/mo or $1,000/yr', nav_funeral: 'Funeral Services Benefit',
  nav_funeral_desc: '$10,000 household benefit', nav_funeral_short: 'Funeral Services', nav_about_us: 'About Us', nav_about_us_desc: 'Our story, programs & facility',
  nav_contact: 'Contact Us', nav_contact_desc: 'Reach the BMCC office', member_login: 'Member Login', search_placeholder: 'Search the site…',
  next_prayer: 'Next Prayer', header_donate: 'Donate Now', tomorrow: 'tomorrow', announcements_label: 'Updates',
  announcement: 'Announcement: Weekend Islamic Studies registration for the Fall term opens August 4 — space is limited to 30 students per class.',
  ann_2: "Jumu'ah khutbah begins at 1:00 PM — please arrive early, overflow parking fills quickly.",
  ann_3: 'Food pantry distribution every Saturday, 10 AM – 12 PM. Donations of non-perishables welcome.',
  ann_4: 'Become a member for $100/mo or $1,000/yr — includes the $10,000 Funeral Services Benefit.',
  prayer_fajr: 'Fajr', prayer_dhuhr: 'Dhuhr', prayer_asr: 'Asr', prayer_maghrib: 'Maghrib', prayer_isha: 'Isha', prayer_jumuah: "Jumu'ah"
};

// Adhan times (24h) — keep in sync with Prayer Times page / admin feed.
const PRAYER_SCHEDULE = [
  { key: 'prayer_fajr', h: 5, m: 12 },
  { key: 'prayer_dhuhr', h: 12, m: 45, friday: { key: 'prayer_jumuah', h: 13, m: 0 } },
  { key: 'prayer_asr', h: 17, m: 45 }, // Hanafi (shadow = 2× object length)
  { key: 'prayer_maghrib', h: 19, m: 58 },
  { key: 'prayer_isha', h: 21, m: 20 }
];
const MASJID_TZ = 'America/Los_Angeles';
const LOCALES = { en: 'en-US', dari: 'fa-AF', urdu: 'ur-PK', pashto: 'ps-AF', arabic: 'ar' };

function masjidNow() {
  const p = new Intl.DateTimeFormat('en-US', { timeZone: MASJID_TZ, weekday: 'short', hour: 'numeric', minute: 'numeric', hourCycle: 'h23' })
    .formatToParts(new Date()).reduce((o, x) => (o[x.type] = x.value, o), {});
  const days = { Sun: 0, Mon: 1, Tue: 2, Wed: 3, Thu: 4, Fri: 5, Sat: 6 };
  return { day: days[p.weekday], mins: (+p.hour % 24) * 60 + (+p.minute) };
}
function prayersFor(day) {
  return PRAYER_SCHEDULE.map(p => (day === 5 && p.friday) ? p.friday : p);
}
function nextPrayer() {
  const { day, mins } = masjidNow();
  const today = prayersFor(day).find(p => p.h * 60 + p.m > mins);
  if (today) return { ...today, tomorrow: false };
  return { ...prayersFor((day + 1) % 7)[0], tomorrow: true };
}
function formatTime(h, m, lang) {
  try {
    return new Intl.DateTimeFormat(LOCALES[lang] || 'en-US', { hour: 'numeric', minute: '2-digit', timeZone: 'UTC' })
      .format(new Date(Date.UTC(2000, 0, 1, h, m)));
  } catch (e) { return ((h % 12) || 12) + ':' + String(m).padStart(2, '0') + (h < 12 ? ' AM' : ' PM'); }
}

class Component extends DCLogic {
  state = { mobileNavOpen: false, langOpen: false, searchOpen: false, searchQuery: '', openMenuId: null, lang: 'en', i18n: EN_DEFAULT };

  componentDidMount() {
    import('./i18n.js').then(m => {
      this.i18nMod = m;
      const lang = m.getLang();
      this.setState({ lang, i18n: { ...EN_DEFAULT, ...m.t(lang) } });
    });
    window.addEventListener('storage', this.onStorage);
    document.addEventListener('mousedown', this.onDocMouseDown);
    this.prayerTimer = setInterval(() => this.forceUpdate(), 30000);
  }
  componentWillUnmount() {
    window.removeEventListener('storage', this.onStorage);
    document.removeEventListener('mousedown', this.onDocMouseDown);
    clearInterval(this.prayerTimer);
  }
  onStorage = () => {
    if (!this.i18nMod) return;
    const lang = this.i18nMod.getLang();
    this.setState({ lang, i18n: { ...EN_DEFAULT, ...this.i18nMod.t(lang) } });
  };
  selectLang = (code) => {
    if (!this.i18nMod) return;
    this.i18nMod.setLang(code);
    this.setState({ lang: code, i18n: { ...EN_DEFAULT, ...this.i18nMod.t(code) }, langOpen: false });
    window.location.reload();
  };

  rootRef = (el) => { this.rootEl = el; };
  onDocMouseDown = (e) => {
    if (this.rootEl && !this.rootEl.contains(e.target) && (this.state.openMenuId !== null || this.state.langOpen)) {
      this.setState({ openMenuId: null, langOpen: false });
    }
  };
  toggleMobileNav = () => this.setState(s => ({ mobileNavOpen: !s.mobileNavOpen }));
  toggleLangOpen = () => this.setState(s => ({ langOpen: !s.langOpen }));
  toggleSearch = () => this.setState(s => ({ searchOpen: !s.searchOpen }));
  onSearchChange = (e) => this.setState({ searchQuery: e.target.value });
  toggleMenu = (id) => this.setState(s => ({ openMenuId: s.openMenuId === id ? null : id }));

  renderVals() {
    const current = this.props.current ?? 'home';
    const t = this.state.i18n || {};
    const styleLink = i => ({
      ...i,
      linkTarget: i.external ? '_blank' : undefined,
      linkRel: i.external ? 'noopener' : undefined
    });

    const menusData = [
      { id: 'home', label: t.nav_home, href: 'BMCC Website.dc.html', hasMenu: false, childIds: [] },
      { id: 'prayer', label: t.nav_prayer, href: 'Prayer Times.dc.html', hasMenu: false, childIds: [] },
      { id: 'programs', label: t.nav_programs, hasMenu: true, childIds: ['hikmah', 'events'], items: [
        { id: 'hikmah', label: t.nav_hikmah, href: 'https://hikmahschool.com/', external: true, description: t.nav_hikmah_desc },
        { id: 'events', label: t.nav_events, href: 'Events.dc.html', description: t.nav_events_desc }
      ]},
      { id: 'community', label: t.nav_community, href: 'Community.dc.html', hasMenu: false, childIds: [] },
      { id: 'services-assistance', label: t.nav_services_assistance, hasMenu: true, childIds: ['services', 'assistance'], items: [
        { id: 'services', label: t.nav_services, href: 'Services.dc.html', description: t.nav_services_desc },
        { id: 'assistance', label: t.nav_assistance, href: 'Assistance.dc.html', description: t.nav_assistance_desc }
      ]},
      { id: 'give', label: t.nav_give, hasMenu: true, childIds: ['donate', 'membership'], items: [
        { id: 'donate', label: t.nav_donate, href: 'Donate.dc.html', description: t.nav_donate_desc },
        { id: 'membership', label: t.nav_membership, href: 'Membership.dc.html', description: t.nav_membership_desc }
      ]},
      { id: 'funeral', label: t.nav_funeral_short, href: 'Funeral Services.dc.html', hasMenu: false, childIds: [] },
      { id: 'about', label: t.nav_about, hasMenu: true, childIds: ['about', 'contact'], items: [
        { id: 'about', label: t.nav_about_us, href: 'About Us.dc.html', description: t.nav_about_us_desc },
        { id: 'contact', label: t.nav_contact, href: 'About Us.dc.html#contact', description: t.nav_contact_desc }
      ]}
    ];

    const menus = menusData.map(m => {
      const isActive = current === m.id || m.childIds.includes(current);
      return {
        ...m,
        color: isActive ? '#101d33' : '#101828',
        borderColor: isActive ? '#2f6fed' : 'transparent',
        open: this.state.openMenuId === m.id,
        toggle: () => this.toggleMenu(m.id),
        items: m.items ? m.items.map(styleLink) : undefined
      };
    });

    const LANGS = (this.i18nMod && this.i18nMod.LANGS) || [{ code: 'en', label: 'English (US)' }, { code: 'dari', label: 'Dari' }, { code: 'urdu', label: 'Urdu' }, { code: 'pashto', label: 'Pashtu' }];
    const languages = LANGS.map(l => ({ name: l.label, select: () => this.selectLang(l.code) }));
    const langLabel = (LANGS.find(l => l.code === this.state.lang) || LANGS[0]).label;
    const dir = (this.i18nMod && this.i18nMod.isRTL(this.state.lang)) ? 'rtl' : 'ltr';

    const np = nextPrayer();
    const npLang = this.state.lang || 'en';
    const annBase = [
      { text: (t.announcement || '').replace(/^[^:：]{1,20}[:：]\s*/, ''), href: 'Events.dc.html' },
      { text: t.ann_2, href: 'Prayer Times.dc.html' },
      { text: t.ann_3, href: 'Assistance.dc.html' },
      { text: t.ann_4, href: 'Membership.dc.html' }
    ].filter(a => a.text);
    const tickerItems = [...annBase, ...annBase];
    return {
      tickerItems,
      nextPrayerName: t[np.key],
      nextPrayerTime: formatTime(np.h, np.m, npLang),
      nextPrayerTomorrow: np.tomorrow,
      mobileNavOpen: this.state.mobileNavOpen,
      toggleMobileNav: this.toggleMobileNav,
      langOpen: this.state.langOpen,
      toggleLangOpen: this.toggleLangOpen,
      langLabel,
      languages,
      dir,
      t,
      searchOpen: this.state.searchOpen,
      toggleSearch: this.toggleSearch,
      searchQuery: this.state.searchQuery,
      onSearchChange: this.onSearchChange,
      rootRef: this.rootRef,
      menus
    };
  }
}
</script>
</body>
</html>
