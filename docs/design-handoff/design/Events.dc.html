<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<template id="__bundler_thumbnail" data-bg-color="#101d33">
<svg viewBox="0 0 1200 800" xmlns="http://www.w3.org/2000/svg">
  <circle cx="600" cy="360" r="180" fill="none" stroke="#eef2f8" stroke-width="24"/>
  <text x="600" y="620" font-family="sans-serif" font-size="90" font-weight="700" fill="#eef2f8" text-anchor="middle">BMCC</text>
</svg>
</template>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  body { margin: 0; background: #f6f7f9; }
  * { box-sizing: border-box; }
  a { color: #101d33; text-decoration: none; }
  a:hover { color: #2f6fed; }

  @media (max-width: 900px) {
    [data-g2] { grid-template-columns: 1fr !important; }
    [data-g3] { grid-template-columns: 1fr !important; }
    [data-g4a] { grid-template-columns: repeat(2,minmax(0,1fr)) !important; }
    [data-g4b] { grid-template-columns: repeat(2,minmax(0,1fr)) !important; }
    [data-g5] { grid-template-columns: repeat(2,minmax(0,1fr)) !important; }
    [data-table-scroll] { overflow-x: auto !important; -webkit-overflow-scrolling: touch; }
    [data-table-min] { min-width: 720px !important; }
  }
  @media (max-width: 620px) {
    [data-g4a] { grid-template-columns: 1fr !important; }
    [data-g5] { grid-template-columns: 1fr !important; }
  }
  @media (max-width: 480px) {
    [data-table-compact] { font-size: 12.5px !important; padding: 10px 12px !important; }
  }
</style>
</helmet>

<div dir="{{ dir }}" style="font-family: Inter, ui-sans-serif, system-ui, sans-serif; color: #101828; background: #f6f7f9; min-height: 100vh;">

  <dc-import name="Site Header" current="events" hint-size="100%,110">
  </dc-import>

  <section style="max-width:1180px; margin:0 auto; padding:clamp(36px,5vw,56px) clamp(20px,4vw,32px);">
    <div style="display:flex; justify-content:space-between; align-items:flex-end; gap:20px; margin-bottom:22px; flex-wrap:wrap;">
      <div style="max-width:600px;">
        <div style="text-transform:uppercase; letter-spacing:0.12em; font-size:13px; font-weight:700; color:#2354a6; margin-bottom:12px;">{{ t.events_eyebrow }}</div>
        <h1 style="font-size:clamp(28px,3.6vw,42px); font-weight:800; letter-spacing:-0.02em; margin:0 0 10px 0; color:#0b1524;">{{ t.events_heading }}</h1>
        <p style="font-size:16.5px; line-height:1.7; color:#384152; margin:0;">{{ t.events_paragraph }}</p>
      </div>
    </div>
    <div data-g2 style="display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:20px;">
      <sc-for list="{{ events }}" as="ev" hint-placeholder-count="4">
        <div style="border:1px solid #e2e5ea; border-radius:14px; padding:24px; background:#fff;">
          <div style="display:flex; justify-content:space-between; align-items:flex-start; gap:12px; margin-bottom:12px;">
            <div style="background:#eaf1fe; color:#2354a6; font-weight:700; font-size:12.5px; padding:5px 10px; border-radius:6px;">{{ ev.tag }}</div>
            <div style="font-size:13px; color:#6b7280; text-align:right; white-space:nowrap;">{{ ev.date }}<br />{{ ev.time }}</div>
          </div>
          <h3 style="margin:0 0 8px 0; font-size:17.5px; font-weight:700; color:#0b1524;">{{ ev.title }}</h3>
          <p style="font-size:14.5px; line-height:1.6; color:#384152; margin:0 0 16px 0;">{{ ev.description }}</p>
          <div style="display:flex; justify-content:space-between; align-items:center; gap:12px; border-top:1px solid #f0eee5; padding-top:14px;">
            <span style="font-size:13px; color:#6b7280;">📍 {{ ev.location }}</span>
            <div style="display:flex; gap:8px;">
              <a href="#" style="font-size:12.5px; font-weight:700; color:#101d33; border:1px solid #dbe1e8; padding:6px 10px; border-radius:6px;">{{ t.events_ical }}</a>
              <a href="#" style="font-size:12.5px; font-weight:700; color:#101d33; border:1px solid #dbe1e8; padding:6px 10px; border-radius:6px;">{{ t.events_gcal }}</a>
            </div>
          </div>
        </div>
      </sc-for>
    </div>
  </section>

  <dc-import name="Site Footer" hint-size="100%,300">
  </dc-import>

</div>

</x-dc>
<script type="text/x-dc" data-dc-script>
const EN_DEFAULT = {
  events_eyebrow: 'Calendar', events_heading: 'Upcoming Events', events_paragraph: 'Join us for weekly programs and community gatherings. Add any event straight to your calendar.',
  events_ical: '+ iCal', events_gcal: '+ Google',
  ev1_tag: 'Weekly', ev1_title: "Jumu'ah Khutbah Series", ev1_location: 'Main Prayer Hall', ev1_desc: 'Weekly Friday sermon and congregational prayer, open to the whole community.',
  ev2_tag: 'Youth', ev2_title: 'Weekend Islamic Studies for Youth', ev2_location: 'Hikmah School Wing', ev2_desc: "Qur'an, Arabic, and Islamic studies classes for students ages 6–16.",
  ev3_tag: 'Community', ev3_title: 'Community Iftar-Style Dinner Night', ev3_location: 'Community Hall', ev3_desc: 'A shared evening meal and fellowship for members and their families.',
  ev4_tag: 'Governance', ev4_title: 'Annual General Meeting', ev4_location: 'Community Hall', ev4_desc: 'Yearly update on finances, programs, and board elections. Open to all members.'
};
class Component extends DCLogic {
  state = { lang: 'en', i18n: EN_DEFAULT };
  componentDidMount() {
    import('./i18n.js').then(m => {
      this.i18nMod = m;
      const lang = m.getLang();
      if (lang !== 'en') this.setState({ lang, i18n: { ...EN_DEFAULT, ...m.t(lang) } });
    });
  }
  renderVals() {
    const t = this.state.i18n;
    const dir = (this.i18nMod && this.i18nMod.isRTL(this.state.lang)) ? 'rtl' : 'ltr';
    return {
      t, dir,
      events: [
        { tag: t.ev1_tag, date: 'Every Friday', time: '1:00 PM – 2:00 PM', title: t.ev1_title, location: t.ev1_location, description: t.ev1_desc },
        { tag: t.ev2_tag, date: 'Saturdays, starts Aug 8', time: '10:00 AM – 12:30 PM', title: t.ev2_title, location: t.ev2_location, description: t.ev2_desc },
        { tag: t.ev3_tag, date: 'Sat, Aug 22', time: '6:30 PM – 9:00 PM', title: t.ev3_title, location: t.ev3_location, description: t.ev3_desc },
        { tag: t.ev4_tag, date: 'Sun, Sep 6', time: '11:00 AM – 1:00 PM', title: t.ev4_title, location: t.ev4_location, description: t.ev4_desc }
      ]
    };
  }
}
</script>
</body>
</html>
