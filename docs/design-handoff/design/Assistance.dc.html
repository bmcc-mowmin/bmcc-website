<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<template id="__bundler_thumbnail" data-bg-color="#101d33">
<svg viewBox="0 0 1200 800" xmlns="http://www.w3.org/2000/svg">
  <circle cx="600" cy="360" r="180" fill="none" stroke="#eef2f8" stroke-width="24"/>
  <text x="600" y="620" font-family="sans-serif" font-size="90" font-weight="700" fill="#eef2f8" text-anchor="middle">BMCC</text>
</svg>
</template>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  body { margin: 0; background: #f6f7f9; }
  * { box-sizing: border-box; }
  a { color: #101d33; text-decoration: none; }
  a:hover { color: #2f6fed; }

  @media (max-width: 900px) {
    [data-g2] { grid-template-columns: 1fr !important; }
    [data-g3] { grid-template-columns: 1fr !important; }
    [data-g4a] { grid-template-columns: repeat(2,minmax(0,1fr)) !important; }
    [data-g4b] { grid-template-columns: repeat(2,minmax(0,1fr)) !important; }
    [data-g5] { grid-template-columns: repeat(2,minmax(0,1fr)) !important; }
    [data-table-scroll] { overflow-x: auto !important; -webkit-overflow-scrolling: touch; }
    [data-table-min] { min-width: 720px !important; }
  }
  @media (max-width: 620px) {
    [data-g4a] { grid-template-columns: 1fr !important; }
    [data-g5] { grid-template-columns: 1fr !important; }
  }
  @media (max-width: 480px) {
    [data-table-compact] { font-size: 12.5px !important; padding: 10px 12px !important; }
  }
</style>
</helmet>

<div dir="{{ dir }}" style="font-family: Inter, ui-sans-serif, system-ui, sans-serif; color: #101828; background: #f6f7f9; min-height: 100vh;">

  <dc-import name="Site Header" current="assistance" hint-size="100%,110">
  </dc-import>

  <section style="max-width:1180px; margin:0 auto; padding:clamp(36px,5vw,56px) clamp(20px,4vw,32px);">
    <div style="max-width:640px; margin-bottom:22px;">
      <div style="text-transform:uppercase; letter-spacing:0.12em; font-size:13px; font-weight:700; color:#2354a6; margin-bottom:12px;">{{ t.assist_eyebrow }}</div>
      <h1 style="font-size:clamp(28px,3.6vw,42px); font-weight:800; letter-spacing:-0.02em; margin:0 0 10px 0; color:#0b1524;">{{ t.assist_heading }}</h1>
      <p style="font-size:16.5px; line-height:1.7; color:#384152; margin:0;">{{ t.assist_paragraph }}</p>
    </div>
    <div data-g2 style="display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:16px;">
      <sc-for list="{{ assistance }}" as="a" hint-placeholder-count="7">
        <div style="border:1px solid #e2e5ea; border-radius:12px; background:#fff; overflow:hidden;">
          <button onClick="{{ a.toggle }}" style="width:100%; text-align:left; background:none; border:none; cursor:pointer; font-family:inherit; padding:22px; display:flex; flex-direction:column; gap:8px;">
            <span style="font-size:22px;">{{ a.icon }}</span>
            <span style="font-weight:700; font-size:15.5px; color:#0b1524; display:flex; justify-content:space-between; align-items:center;">{{ a.title }} <span style="font-size:12px; color:#98a2b3;">{{ a.toggleLabel }}</span></span>
            <span style="font-size:13.5px; color:#6b7280; line-height:1.5;">{{ a.description }}</span>
          </button>
          <sc-if value="{{ a.expanded }}">
            <div style="padding:0 22px 22px 22px; border-top:1px solid #f0eee5; margin-top:-1px;">
              <p style="font-size:14px; line-height:1.7; color:#384152; margin:16px 0;">{{ a.detail }}</p>
              <a href="{{ a.href }}" style="font-weight:700; font-size:13.5px; color:#101d33;">{{ a.cta }} →</a>
            </div>
          </sc-if>
        </div>
      </sc-for>
    </div>
  </section>

  <dc-import name="Site Footer" hint-size="100%,300">
  </dc-import>

</div>

</x-dc>
<script type="text/x-dc" data-dc-script>
const EN_DEFAULT = {
  assist_eyebrow: 'Assistance', assist_heading: 'Community Assistance', assist_paragraph: 'Extending a helping hand to neighbors in need, in Brentwood and beyond.',
  a_zakat_title: 'Zakat & Sadaqa', a_zakat_desc: 'Fulfill your Zakat-ul-Maal and Sadaqa obligations through BMCC.', a_zakat_detail: 'BMCC collects and distributes Zakat-ul-Maal and Sadaqa to eligible recipients in our community and beyond, in accordance with Islamic guidelines.', a_zakat_cta: 'Give Zakat or Sadaqa',
  a_pantry_title: 'Food Pantry', a_pantry_desc: 'Groceries and essentials for community families facing hardship.', a_pantry_detail: 'Groceries and household essentials are available weekly for families facing hardship — no referral required, all inquiries kept confidential.', a_pantry_cta: 'Contact the pantry',
  a_refugee_title: 'Refugee Support', a_refugee_desc: 'Resettlement help and everyday support for refugee families.', a_refugee_detail: 'Practical resettlement support — furniture, guidance, and community connections — for refugee families new to the Bay Area.', a_refugee_cta: 'Request support',
  a_funeral_title: 'Funeral & Burial', a_funeral_desc: 'The Funeral Services Benefit and burial support for members.', a_funeral_detail: 'Members receive up to $10,000 toward funeral and burial costs for their household through the BMCC Funeral Services Benefit.', a_funeral_cta: 'View full policy',
  a_clothing_title: 'Clothing Donations', a_clothing_desc: 'Donate gently-used clothing for families in need.', a_clothing_detail: 'Drop off gently-used clothing at the masjid; items are distributed directly to families in our community who need them.', a_clothing_cta: 'Arrange a drop-off',
  a_furniture_title: 'Furniture Donation', a_furniture_desc: 'Furnish a home in need with your gently-used furniture.', a_furniture_detail: 'Donate gently-used furniture to help furnish a home for a family starting over — pickup can often be arranged.', a_furniture_cta: 'Donate furniture',
  a_vehicle_title: 'Vehicle Donation', a_vehicle_desc: 'Donate a vehicle to support BMCC community programs.', a_vehicle_detail: "Donate a car, truck, or other vehicle — proceeds go directly toward BMCC's community programs and assistance funds.", a_vehicle_cta: 'Donate a vehicle',
  more_label: 'More ▾', less_label: 'Less ▴'
};
class Component extends DCLogic {
  state = { expandedId: null, lang: 'en', i18n: EN_DEFAULT };
  componentDidMount() {
    import('./i18n.js').then(m => {
      this.i18nMod = m;
      const lang = m.getLang();
      if (lang !== 'en') this.setState({ lang, i18n: { ...EN_DEFAULT, ...m.t(lang) } });
    });
  }
  toggle = (id) => this.setState(s => ({ expandedId: s.expandedId === id ? null : id }));

  renderVals() {
    const t = this.state.i18n;
    const dir = (this.i18nMod && this.i18nMod.isRTL(this.state.lang)) ? 'rtl' : 'ltr';
    const data = [
      { id: 'zakat', title: t.a_zakat_title, icon: '✦', description: t.a_zakat_desc, detail: t.a_zakat_detail, href: 'Donate.dc.html', cta: t.a_zakat_cta },
      { id: 'pantry', title: t.a_pantry_title, icon: '◈', description: t.a_pantry_desc, detail: t.a_pantry_detail, href: 'About Us.dc.html#contact', cta: t.a_pantry_cta },
      { id: 'refugee', title: t.a_refugee_title, icon: '◇', description: t.a_refugee_desc, detail: t.a_refugee_detail, href: 'About Us.dc.html#contact', cta: t.a_refugee_cta },
      { id: 'funeral', title: t.a_funeral_title, icon: '❖', description: t.a_funeral_desc, detail: t.a_funeral_detail, href: 'Funeral Services.dc.html', cta: t.a_funeral_cta },
      { id: 'clothing', title: t.a_clothing_title, icon: '⌂', description: t.a_clothing_desc, detail: t.a_clothing_detail, href: 'About Us.dc.html#contact', cta: t.a_clothing_cta },
      { id: 'furniture', title: t.a_furniture_title, icon: '◐', description: t.a_furniture_desc, detail: t.a_furniture_detail, href: 'About Us.dc.html#contact', cta: t.a_furniture_cta },
      { id: 'vehicle', title: t.a_vehicle_title, icon: '✎', description: t.a_vehicle_desc, detail: t.a_vehicle_detail, href: 'About Us.dc.html#contact', cta: t.a_vehicle_cta }
    ];
    const assistance = data.map(a => ({
      ...a,
      toggle: () => this.toggle(a.id),
      expanded: this.state.expandedId === a.id,
      toggleLabel: this.state.expandedId === a.id ? t.less_label : t.more_label
    }));
    return { t, dir, assistance };
  }
}
</script>
</body>
</html>
