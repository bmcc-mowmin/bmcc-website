# Local development stack.
#   docker compose up -d                 → Postgres + Mailpit (then `npm run dev`)
#   docker compose --profile app up -d   → also runs the production build of the app
name: bmcc
services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-bmcc}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-bmcc}
      POSTGRES_DB: ${POSTGRES_DB:-bmcc}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 20

  mailpit:
    image: axllent/mailpit:latest
    restart: unless-stopped
    ports:
      - "${MAILPIT_UI_PORT:-8025}:8025" # web inbox
      - "${MAILPIT_SMTP_PORT:-1025}:1025" # SMTP
    environment:
      MP_SMTP_AUTH_ACCEPT_ANY: "true"
      MP_SMTP_AUTH_ALLOW_INSECURE: "true"

  app:
    profiles: ["app"]
    build: .
    env_file: .env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-bmcc}:${POSTGRES_PASSWORD:-bmcc}@db:5432/${POSTGRES_DB:-bmcc}
      SMTP_HOST: mailpit
      SMTP_PORT: "1025"
      UPLOAD_DIR: /app/uploads
    ports:
      - "${APP_PORT:-3000}:3000"
    volumes:
      - uploads:/app/uploads
    depends_on:
      db:
        condition: service_healthy
      mailpit:
        condition: service_started

volumes:
  pgdata:
  uploads:
